name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  TORCH_VERSION: "2.5.1"
  PYG_TORCH_VERSION: "2.5.0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyTorch CPU (pinned version)
        run: |
          python -m pip install --upgrade pip
          pip install torch==${{ env.TORCH_VERSION }} --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyG extensions (matching torch version)
        run: |
          pip install torch_scatter torch_sparse torch_cluster -f https://data.pyg.org/whl/torch-${{ env.PYG_TORCH_VERSION }}+cpu.html

      - name: Install mdtraj dependency
        run: |
          pip install mdtraj

      - name: Install package and test dependencies
        run: |
          pip install -e ".[test]"

      - name: Run unit and integration tests (skip GPU and slow tests)
        run: |
          pytest tests/unit tests/integration -m "not gpu and not slow" --tb=short -v

      - name: Run regression tests
        run: |
          pytest tests/regression -m "not gpu and not slow" --tb=short -v
